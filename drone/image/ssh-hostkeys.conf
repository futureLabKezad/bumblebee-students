# Installed as /etc/systemd/system/ssh.service.d/10-bumblebee-hostkeys.conf.
# Release images ship without SSH host keys so every drone gets its own.
# Create any missing keys before ssh.service's own config test (`sshd -t`
# fails without host keys), keeping the original ExecStartPre afterwards.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
