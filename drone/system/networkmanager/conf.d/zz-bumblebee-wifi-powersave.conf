# Wi-Fi power saving on the Pi drops mDNS multicast and adds latency spikes,
# so the GCS loses Bonjour discovery and the video/telemetry stutters.
# NM reads conf.d in alphabetical order and the last value wins, so this must
# sort after default-wifi-powersave-on.conf. Takes effect after a reboot.
[connection]
wifi.powersave = 2
