# Bigger socket buffers for ROS 2 (Fast DDS). With the 208 KB default every
# DDS port on drone 20EC dropped packets (tens of thousands of RcvbufErrors in
# the first minutes: discovery and reliability traffic of ~25 nodes, camera
# frames). Fast DDS uses the system default size for its sockets.
net.core.rmem_max = 8388608
net.core.rmem_default = 4194304
net.core.wmem_max = 8388608
net.core.wmem_default = 1048576
