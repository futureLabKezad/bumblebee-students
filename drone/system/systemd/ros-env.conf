# This drone's ROS 2 domain (ROS_DOMAIN_ID), shared by every Bumblebee service
# that runs ROS nodes; /etc/bumblebee/ros.env is written by set_identity.sh
# (ros_domain.py), so drones on one Wi-Fi never see each other's ROS graph.
# The transport is also set here, so it holds even before ros.env exists.
[Service]
Environment=FASTDDS_BUILTIN_TRANSPORTS=UDPv4
EnvironmentFile=-/etc/bumblebee/ros.env
