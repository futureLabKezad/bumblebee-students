# Fast checks for the GCS apps, separate from ci.yml (which builds them):
#  - the apps only watch the drone (gcs/tools/check_watch_only.py);
#  - Info.plist, the csproj and app.manifest carry gcs/VERSION;
#  - the mock drone used for app testing still drives the real wifi_manager.py.
name: GCS checks

on:
  push:
    paths:
      - 'gcs/**'
      - 'drone/ros2_ws/src/bumblebee/scripts/wifi_manager.py'
      - '.github/workflows/gcs-checks.yml'
  pull_request:
    paths:
      - 'gcs/**'
      - 'drone/ros2_ws/src/bumblebee/scripts/wifi_manager.py'
      - '.github/workflows/gcs-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-only-and-mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'   # the drone runs Ubuntu 24.04's python 3.12
      - name: The apps only watch the drone
        run: python3 gcs/tools/check_watch_only.py
      - name: Tests of the watch-only check
        run: python3 gcs/tools/test_check_watch_only.py -v
      - name: Every copy of the version agrees with gcs/VERSION
        run: |
          python3 gcs/tools/check_versions.py
          python3 gcs/tools/test_check_versions.py -v
      - name: Install the mock drone's dependencies
        run: pip install 'tornado==6.4' bcrypt
      - name: Mock drone states, end to end
        env:
          MOCK_E2E_REQUIRED: '1'
        run: python3 gcs/tools/test_mock_drone.py -v
