name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcs-macos:
    name: macOS GCS app (ready-to-run .dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build release app bundle (Apple Silicon + Intel)
        working-directory: gcs/macos
        run: ./build_app.sh release
      - name: Check the bundle
        working-directory: gcs/macos
        run: |
          test -x "build/Bumblebee GCS.app/Contents/MacOS/GCSApp"
          plutil -lint "build/Bumblebee GCS.app/Contents/Info.plist"
          lipo "build/Bumblebee GCS.app/Contents/MacOS/GCSApp" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "build/Bumblebee GCS.app"
      - name: Package disk image
        working-directory: gcs/macos
        run: ./make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BumblebeeGCS-mac
          path: |
            gcs/macos/build/BumblebeeGCS-*-mac.dmg
            gcs/macos/build/BumblebeeGCS-*-mac.dmg.sha256
          if-no-files-found: error

  gcs-windows:
    name: Windows GCS app (ready-to-run .zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained app (no .NET needed on the PC)
        working-directory: gcs/windows
        run: dotnet publish src\BumblebeeGcs\BumblebeeGcs.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o publish\BumblebeeGCS
      - name: Package zip
        working-directory: gcs/windows
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content src\BumblebeeGcs\BumblebeeGcs.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not (Test-Path publish\BumblebeeGCS\BumblebeeGcs.exe)) { throw "BumblebeeGcs.exe missing from publish output" }
          Copy-Item "How to open.txt" "publish\BumblebeeGCS\Как открыть - How to open.txt"
          $zip = "BumblebeeGCS-$ver-windows-x64.zip"
          Compress-Archive -Path publish\BumblebeeGCS -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: BumblebeeGCS-windows
          path: |
            gcs/windows/BumblebeeGCS-*-windows-x64.zip
            gcs/windows/BumblebeeGCS-*-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GCS downloads (tags gcs-v*)
    if: startsWith(github.ref, 'refs/tags/gcs-v')
    needs: [gcs-macos, gcs-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Ready-to-run Bumblebee GCS — nothing to build.
            - Mac (Apple Silicon and Intel, macOS 14+): open the .dmg, drag the app onto Applications.
            - Windows 10/11 x64: unzip, run BumblebeeGcs.exe.
            First launch: see "How to open" inside (one-time system warning; allow Location to find drones).

  drone-tests:
    name: Drone scripts (unit + simulation tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the drone runs Ubuntu 24.04's python 3.12
      - name: Install test dependencies
        run: pip install 'tornado==6.4' bcrypt
      - name: Syntax-check shell scripts
        run: |
          for f in drone/ros2_ws/src/bumblebee/scripts/*.sh drone/tools/*.sh \
                   drone/system/networkmanager/dispatcher.d/* drone/system/start_bumblebee.sh \
                   drone/system/profile.d/*.sh drone/image/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: Run tests
        working-directory: drone/ros2_ws/src/bumblebee
        # discover, not "unittest test/x.py": that imports test.x, and on Linux
        # "test" is Python's own stdlib test package, so nothing would load.
        run: python -m unittest discover -v -s test -p 'test_*.py'

  drone-ros:
    name: Drone ROS package (colcon build + test, ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS 2 Jazzy from packages.ros.org
        env:
          # ros-infrastructure/ros-apt-source: the packages.ros.org apt source and key
          ROS_APT_SOURCE_VERSION: '1.3.0'
          ROS_APT_SOURCE_SHA256: f31d84adf5054c7d60ded0e82c0f776a77ea33af53d08f40b9ad7c94cca55296
        run: |
          deb="ros2-apt-source_${ROS_APT_SOURCE_VERSION}.noble_all.deb"
          curl -fsSL -o "/tmp/$deb" \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/$deb"
          echo "${ROS_APT_SOURCE_SHA256}  /tmp/$deb" | sha256sum -c -
          sudo dpkg -i "/tmp/$deb"
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            ros-jazzy-ros-base ros-dev-tools python3-colcon-common-extensions \
            ros-jazzy-mavros-msgs ros-jazzy-tf2-geometry-msgs ros-jazzy-cv-bridge \
            ros-jazzy-image-transport ros-jazzy-image-proc ros-jazzy-image-geometry \
            ros-jazzy-rclcpp-components ros-jazzy-visualization-msgs \
            libgeographiclib-dev geographiclib-tools libopencv-dev python3-lxml python3-pytest \
            ros-jazzy-ament-cmake-gtest ros-jazzy-ament-cmake-pytest ros-jazzy-ament-cmake-ros \
            ros-jazzy-launch-testing-ament-cmake ros-jazzy-launch-testing-ros
      - name: colcon build
        working-directory: drone/ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select bumblebee --event-handlers console_direct+
      - name: colcon test
        working-directory: drone/ros2_ws
        # simple_offboard gtest + launch tests against a fake MAVROS, on the wall
        # clock and under a fake sim /clock (no FCU, nothing can arm), drone.py
        # flight guards with ROS faked
        run: |
          source /opt/ros/jazzy/setup.bash
          # the launch tests look the package up in the ament index: put the
          # freshly built bumblebee on AMENT_PREFIX_PATH
          source install/setup.bash
          colcon test --packages-select bumblebee --event-handlers console_direct+
          colcon test-result --verbose
