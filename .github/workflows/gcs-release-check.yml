# A gcs-v* tag must match gcs/VERSION and the versions the builds read.
# This runs next to ci.yml's release job and turns red on a mismatch; it does
# not stop that job yet (that needs a change in ci.yml).
name: GCS release tag check

on:
  push:
    tags: ['gcs-v*']

permissions:
  contents: read

jobs:
  tag-matches-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Tag, gcs/VERSION, Info.plist, csproj and app.manifest agree
        run: python3 gcs/tools/check_versions.py --tag "$GITHUB_REF_NAME"
